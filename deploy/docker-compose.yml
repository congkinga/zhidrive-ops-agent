services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: zhidrive-ops-api
    env_file:
      - ../.env.local
    ports:
      - "8766:8766"
    volumes:
      - ../data:/app/data
      - ../website:/app/website
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: zhidrive-ops-nginx
    depends_on:
      - api
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../website:/usr/share/nginx/html/website:ro
    restart: unless-stopped
